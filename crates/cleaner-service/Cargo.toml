[package]
name = "cleaner-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CleanCore Service Center: Software Inventory, Startup, Defender Status, Diagnostics, Tools and Reports"

[dependencies]
cleaner-core = { path = "../cleaner-core" }
cleaner-execution = { path = "../cleaner-execution" }
cleaner-system = { path = "../cleaner-system" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Services",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
] }
